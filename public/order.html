<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>주문 입력</title>
  <link rel="stylesheet" href="/common.css">
  <style>
    body { min-height: 100vh; display: flex; flex-direction: column; }
    main { flex: 1; width: 100%; max-width: 1120px; margin: 0 auto; padding: 16px 16px 24px; }
    h2 { margin: 8px 0 16px; font-size: var(--t-xl); font-weight: 800; }

    /* 1단계: 테이블 선택 */
    #step-table { max-width: 760px; margin: 0 auto; }
    .tables { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .tables button {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      aspect-ratio: 1;
      padding: 4px;
      border: 1px solid var(--line);
      background: var(--surface);
      font-size: var(--t-3xl);
      font-weight: 800;
      line-height: 1.1;
      color: var(--text);
    }
    /* 진행 중 표시는 아래쪽에 겹쳐 놓아, 있든 없든 번호가 항상 정중앙에 오게 한다. */
    .tables button small { position: absolute; left: 4px; right: 4px; bottom: 12%; font-size: var(--t-xs); font-weight: 700; color: var(--muted); }
    .tables button.busy { border: 2px solid var(--text); }
    .tables button.busy small { color: var(--text); }

    .recent { margin-top: 28px; }
    .recent h3 { margin: 0 0 8px; font-size: var(--t-md); font-weight: 700; color: var(--muted); }
    .recent ul { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
    .recent li { display: flex; gap: 12px; align-items: baseline; padding: 12px 14px; font-size: var(--t-md); border-top: 1px solid var(--line); }
    .recent li:first-child { border-top: none; }
    .recent .tno { font-weight: 800; min-width: 3.2em; }
    .recent .items { flex: 1; }

    /* 2단계: 메뉴 선택 */
    .topbar h1 .tno-num { font-size: 1.25em; }
    .group { margin-top: 28px; }
    .group:first-child { margin-top: 4px; }
    .group h3 { margin: 0 0 10px; font-size: var(--t-xl); font-weight: 800; color: var(--text); }
    /* 옵션 줄이 여러 개인 카드는 두 칸 높이를 차지하고, 남는 자리에 한 줄짜리 카드가 위아래로 채워진다. */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); grid-auto-flow: row dense; gap: 12px; }
    .menu.tall { grid-row: span 2; }

    .menu {
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
    }
    .menu.picked { border: 2px solid var(--text); padding: 15px; }
    .menu.sold-out { background: var(--surface-2); }
    .menu.sold-out .name { color: var(--muted); }
    .menu .head { display: flex; align-items: center; gap: 12px; min-height: 64px; }
    .menu .info { flex: 1; min-width: 0; }
    .menu .name { font-size: var(--t-lg); font-weight: 800; line-height: 1.25; }
    .menu .price { margin-top: 2px; color: var(--muted); font-size: var(--t-sm); font-weight: 600; }
    .menu .price .opt { margin: 0 8px 0 0; color: var(--text); font-size: var(--t-sm); }
    .menu .total {
      min-width: 2.4em;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--text);
      color: #fff;
      text-align: center;
      font-size: var(--t-md);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }
    .menu .badge { font-size: var(--t-sm); padding: 4px 12px; }

    .variants { margin-top: 10px; border-top: 1px solid var(--line); }
    .variant { display: flex; align-items: center; gap: 12px; margin-top: 8px; padding: 4px 4px 4px 10px; border-radius: var(--radius); }
    .variant.has { background: var(--surface-2); }
    .variant .vlabel { flex: 1; min-width: 0; font-size: var(--t-lg); font-weight: 800; }
    .variant .vlabel small { margin-left: 6px; font-size: var(--t-sm); font-weight: 600; color: var(--muted); }

    .stepper { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .stepper button { display: inline-flex; align-items: center; justify-content: center; width: 60px; height: 60px; background: var(--surface-2); border: 1px solid var(--line-strong); color: var(--text); }
    .stepper button .icon { width: 26px; height: 26px; stroke-width: 2.5; }
    .stepper button.plus { background: var(--surface); border-color: var(--line-strong); color: var(--text); }
    .stepper button:disabled { background: var(--disabled-bg); border-color: var(--disabled-bg); color: var(--disabled-text); }
    .stepper .qty { min-width: 2ch; text-align: center; font-size: var(--t-xl); font-weight: 800; font-variant-numeric: tabular-nums; }
    .stepper .qty.zero { color: var(--disabled-text); }

    /* 조합이 너무 많은 메뉴만: 옵션을 골라 담는 방식 */
    .picker { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
    .opt-group { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
    .opt-group .gname { min-width: 3.5em; font-size: var(--t-sm); font-weight: 700; color: var(--muted); }
    .opt-group button { min-height: 52px; padding: 8px 16px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--text); font-size: var(--t-md); font-weight: 700; }
    .opt-group button small { display: block; font-size: var(--t-xs); font-weight: 600; color: var(--muted); }
    .opt-group button.on { border: 2px solid var(--text); padding: 7px 15px; font-weight: 800; }
    .picker .row { display: flex; align-items: center; justify-content: flex-end; gap: 12px; }
    .picker .row .sel { flex: 1; font-weight: 700; color: var(--muted); }

    .note { margin-top: 20px; max-width: 700px; }
    .note label { display: block; margin-bottom: 6px; font-size: var(--t-sm); font-weight: 700; color: var(--muted); }
    .note input {
      width: 100%;
      padding: 16px;
      font: inherit;
      font-size: var(--t-md);
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      background: var(--surface);
    }

    .cartbar {
      position: sticky;
      bottom: 0;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      background: var(--surface);
      border-top: 1px solid var(--line);
      box-shadow: 0 -6px 20px rgba(0, 0, 0, 0.06);
    }
    .cartbar .sum { flex: 1; min-width: 0; }
    .cartbar .count { font-size: var(--t-sm); font-weight: 600; color: var(--muted); }
    .cartbar .big { font-size: var(--t-xl); font-weight: 800; font-variant-numeric: tabular-nums; }
    .cartbar .btn { padding: 18px 28px; font-size: var(--t-lg); }

    /* 확인 / 완료 */
    .lines { width: 100%; border-collapse: collapse; font-size: var(--t-lg); font-weight: 700; font-variant-numeric: tabular-nums; }
    .lines td { padding: 10px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
    .lines td:last-child { text-align: right; white-space: nowrap; padding-left: 12px; }
    .lines .x { white-space: nowrap; }
    .lines tr.total td { border-bottom: none; font-weight: 800; font-size: var(--t-xl); padding-top: 16px; }
    .confirm-table { font-size: var(--t-2xl); font-weight: 800; margin-bottom: 8px; }
    #confirm-note { font-size: var(--t-md); }

    .done { max-width: 560px; margin: 0 auto; text-align: center; padding: 32px 0; }
    .done .check .icon { width: 5rem; height: 5rem; color: var(--served); }
    .done h2 { margin-bottom: 8px; font-size: var(--t-2xl); }
    .done .lines { margin: 16px 0 8px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
    .done .lines td, .done .lines td:last-child { padding: 12px 16px; text-align: left; }
    .done .lines tr:last-child td { border-bottom: none; }
    .done p { font-size: var(--t-md); font-weight: 600; }
    .done .btn { margin-top: 12px; padding: 18px 40px; font-size: var(--t-lg); }

    @media (max-width: 720px) {
      .grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 520px) {
      .tables { gap: 8px; }
      .tables button { font-size: var(--t-2xl); }
      .table-head .tno { font-size: var(--t-xl); }
      #change-table .label { display: none; }
      #change-table { padding: 8px 12px; }
      .stepper button { width: 54px; height: 54px; }
      .cartbar .btn { padding: 16px 18px; }
    }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="home-btn" href="/" aria-label="처음 화면으로"><i data-icon="house"></i><span class="label">처음 화면</span></a>
    <h1 id="title">주문 입력</h1>
    <button class="btn btn-ghost" id="change-table" aria-label="테이블 변경" hidden><i data-icon="arrow-left-right"></i><span class="label">테이블 변경</span></button>
    <span id="conn" class="conn">연결 중…</span>
  </header>

  <main>
    <section id="step-table">
      <h2>테이블을 선택하세요</h2>
      <div class="tables" id="tables"></div>
      <div class="recent" id="recent"></div>
    </section>

    <section id="step-menu" hidden>
      <div id="menus"></div>
      <div class="note">
        <label for="note">요청사항 (선택)</label>
        <input id="note" maxlength="100" placeholder="예: 얼음 적게, 포크 2개">
      </div>
    </section>

    <section id="step-done" class="done" hidden>
      <div class="check"><i data-icon="circle-check-big"></i></div>
      <h2 id="done-title"></h2>
      <table class="lines" id="done-lines"></table>
      <p class="muted" id="done-desc"></p>
      <button class="btn btn-primary" id="done-next">새 주문</button>
    </section>
  </main>

  <footer class="cartbar" id="cartbar" hidden>
    <div class="sum">
      <div class="count" id="cart-count"></div>
      <div class="big" id="cart-big"></div>
    </div>
    <button class="btn btn-primary" id="review" disabled><i data-icon="shopping-cart"></i>주문 확인</button>
  </footer>

  <div class="overlay" id="confirm" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="confirm-table">
      <div class="confirm-table" id="confirm-table"></div>
      <table class="lines" id="confirm-lines"></table>
      <p class="muted" id="confirm-note"></p>
      <div class="actions">
        <button class="btn" id="confirm-cancel">수정</button>
        <button class="btn btn-primary" id="confirm-send"><i data-icon="send"></i><span>주문 전송</span></button>
      </div>
    </div>
  </div>

  <script src="/icons.js"></script>
  <script src="/common.js"></script>
  <script>
    'use strict';
    const $ = (id) => document.getElementById(id);
    const { esc, won } = Kiosk;

    const MAX_ROWS = 6;          // 옵션 조합이 이보다 많으면 줄로 펼치지 않고 골라서 담는다
    const DONE_SECONDS = 8;

    let state = null;
    let table = null;
    let cart = {};               // key -> { menuId, options: [선택지 이름], qty }
    let picked = {};             // menuId -> [옵션별 선택지 번호] (골라서 담는 메뉴만)
    let variants = {};           // key -> { menuId, options } (지금 화면의 +/- 버튼이 가리키는 조합)
    let pendingRequestId = null;
    let sending = false;
    let doneTimer = null;

    const cartKey = (menuId, options) => JSON.stringify([menuId, options]);
    const priceText = (n) => (n === 0 ? '무료' : won(n));
    const plusWon = (n) => (n > 0 ? `+${won(n)}` : n < 0 ? `-${won(-n)}` : '');

    function show(step) {
      for (const s of ['table', 'menu', 'done']) $(`step-${s}`).hidden = s !== step;
      $('cartbar').hidden = step !== 'menu';
      $('change-table').hidden = step !== 'menu';
      // 메뉴 단계에서는 스크롤해도 보이도록 상단 바에 지금 테이블을 둔다.
      $('title').innerHTML = step === 'menu' && table != null ? `<span class="tno-num">${table}</span>번 테이블` : '주문 입력';
      window.scrollTo(0, 0);
    }

    function stopCountdown(message) {
      clearInterval(doneTimer);
      doneTimer = null;
      if (message) $('done-desc').textContent = message;
    }

    function showDoneCountdown(summary) {
      let left = DONE_SECONDS;
      const paint = () => { $('done-desc').textContent = `${summary} · ${left}초 뒤 처음으로 (화면을 누르면 멈춤)`; };
      paint();
      clearInterval(doneTimer);
      doneTimer = setInterval(() => {
        left -= 1;
        if (left <= 0) resetOrder(); else paint();
      }, 1000);
    }

    function resetOrder() {
      table = null;
      cart = {};
      picked = {};
      pendingRequestId = null;
      $('note').value = '';
      stopCountdown();
      renderTables();
      show('table');
    }

    function renderTables() {
      if (!state) return;
      const active = activeCountByTable();
      $('tables').innerHTML = Array.from({ length: state.tables }, (_, i) => {
        const n = i + 1;
        const sub = active[n] ? `<small>진행 중 ${active[n]}건</small>` : '';
        return `<button data-table="${n}" class="${active[n] ? 'busy' : ''}" aria-label="${n}번 테이블${active[n] ? `, 진행 중 ${active[n]}건` : ''}">${n}${sub}</button>`;
      }).join('');

      const recent = state.orders.filter((o) => !o.cancelled).slice(-5).reverse();
      $('recent').innerHTML = recent.length
        ? `<h3>최근 주문</h3><ul>${recent.map((o) => `
            <li>
              <span class="tno">${o.tableNo}번</span>
              <span class="items">${o.tickets.flatMap((t) => t.items).map((it) => `${esc(Kiosk.itemLabel(it))} ${it.qty}`).join(', ')}</span>
              <span class="muted">${Kiosk.time(o.createdAt)}</span>
            </li>`).join('')}</ul>`
        : '';
    }

    function activeCountByTable() {
      const counts = {};
      for (const o of state.orders) {
        if (o.cancelled || o.tickets.every((t) => t.status === 'served')) continue;
        counts[o.tableNo] = (counts[o.tableNo] || 0) + 1;
      }
      return counts;
    }

    /**
     * 메뉴의 옵션 조합 목록. 선택지가 하나뿐인 옵션은 자동으로 들어가고,
     * 둘 이상인 옵션들의 모든 조합을 만든다. 예: 온도(HOT/ICE) → [HOT], [ICE]
     */
    function combos(m) {
      let list = [{ options: [], extra: 0, label: [] }];
      for (const g of m.options) {
        const next = [];
        for (const base of list) {
          for (const c of g.choices) {
            next.push({
              options: [...base.options, c.name],
              extra: base.extra + c.price,
              label: g.choices.length > 1 ? [...base.label, c.name] : base.label,
            });
          }
        }
        list = next;
      }
      return list;
    }

    /** 선택지가 하나뿐인 옵션 이름 (예: 레모네이드의 ICE) — 이름 옆 꼬리표로 보여 준다. */
    function fixedTags(m) {
      return m.options.filter((g) => g.choices.length === 1).map((g) => g.choices[0].name);
    }

    function qtyOf(key) {
      return cart[key] ? cart[key].qty : 0;
    }

    function stepperHtml(key, label, soldOut) {
      const qty = qtyOf(key);
      return `
        <div class="stepper">
          <button data-key="${esc(key)}" data-delta="-1" ${qty === 0 ? 'disabled' : ''} aria-label="${esc(label)} 빼기">${Kiosk.icon('minus')}</button>
          <span class="qty ${qty ? '' : 'zero'}" aria-label="${esc(label)} ${qty}개">${qty}</span>
          <button class="plus" data-key="${esc(key)}" data-delta="1" ${soldOut ? 'disabled' : ''} aria-label="${esc(label)} 더하기">${Kiosk.icon('plus')}</button>
        </div>`;
    }

    /** 조합이 너무 많은 메뉴: 옵션을 고르고 + 를 누른다. */
    function pickerHtml(m) {
      const idx = picked[m.id] || m.options.map(() => 0);
      const choices = m.options.map((g, i) => g.choices[idx[i]] || g.choices[0]);
      const options = choices.map((c) => c.name);
      const key = cartKey(m.id, options);
      variants[key] = { menuId: m.id, options };
      const groups = m.options.filter((g) => g.choices.length > 1).map((g) => {
        const gi = m.options.indexOf(g);
        return `
          <div class="opt-group" role="group" aria-label="${esc(g.name)}">
            <span class="gname">${esc(g.name)}</span>
            ${g.choices.map((c, ci) => `
              <button class="${idx[gi] === ci ? 'on' : ''}" data-opt-menu="${esc(m.id)}" data-group="${gi}" data-choice="${ci}"
                aria-pressed="${idx[gi] === ci}" ${m.soldOut ? 'disabled' : ''}>${esc(c.name)}${c.price ? `<small>${plusWon(c.price)}</small>` : ''}</button>`).join('')}
          </div>`;
      }).join('');
      const label = `${m.name} ${options.join(' ')}`;
      return `
        <div class="picker">
          ${groups}
          <div class="row"><span class="sel">${esc(options.join(' · '))}</span>${stepperHtml(key, label, m.soldOut)}</div>
        </div>`;
    }

    function menuHtml(m) {
      const list = combos(m);
      const tags = fixedTags(m).map((t) => `<span class="opt">${esc(t)}</span>`).join('');
      const total = Object.values(cart).filter((l) => l.menuId === m.id).reduce((s, l) => s + l.qty, 0);
      const price = m.soldOut ? '<span class="badge soldout">품절</span>' : priceText(m.price + (list.length === 1 ? list[0].extra : 0));
      const head = (right) => `
        <div class="head">
          <div class="info">
            <div class="name">${esc(m.name)}</div>
            <div class="price">${tags}${price}</div>
          </div>
          ${right}
        </div>`;
      const cls = `menu ${rowCount(m) > 1 ? 'tall' : ''} ${m.soldOut ? 'sold-out' : total ? 'picked' : ''}`;

      // 옵션 조합이 하나뿐: 수량 버튼을 이름 옆에
      if (list.length === 1) {
        const key = cartKey(m.id, list[0].options);
        variants[key] = { menuId: m.id, options: list[0].options };
        return `<article class="${cls}">${head(stepperHtml(key, m.name, m.soldOut))}</article>`;
      }

      const badge = total ? `<span class="total" aria-label="모두 ${total}개">${total}</span>` : '';
      if (list.length > MAX_ROWS) return `<article class="${cls}">${head(badge)}${pickerHtml(m)}</article>`;

      // 조합마다 한 줄씩: HOT [−] 2 [+] / ICE [−] 1 [+]
      const rows = list.map((v) => {
        const key = cartKey(m.id, v.options);
        variants[key] = { menuId: m.id, options: v.options };
        const label = v.label.join(' · ');
        return `
          <div class="variant ${qtyOf(key) ? 'has' : ''}">
            <span class="vlabel">${esc(label)}${v.extra ? `<small>${plusWon(v.extra)}</small>` : ''}</span>
            ${stepperHtml(key, `${m.name} ${label}`, m.soldOut)}
          </div>`;
      }).join('');
      return `<article class="${cls}">${head(badge)}<div class="variants">${rows}</div></article>`;
    }

    /** 카드에 펼쳐지는 줄 수 (격자에서 같은 높이끼리 짝짓는 데 쓴다) */
    function rowCount(m) {
      const n = combos(m).length;
      return n === 1 || n > MAX_ROWS ? 1 : n;
    }

    /** 메뉴를 주방별로 묶는다. 묶음 순서는 메뉴 목록에 처음 나온 순서. */
    function groupsByStation() {
      const groups = [];
      for (const m of state.menus) {
        let g = groups.find((x) => x.stationId === m.station);
        if (!g) {
          const s = state.stations.find((x) => x.id === m.station);
          g = { stationId: m.station, name: s ? s.name : '', menus: [] };
          groups.push(g);
        }
        g.menus.push(m);
      }
      return groups;
    }

    function renderMenus() {
      if (!state || table == null) return;
      variants = {};
      const groups = groupsByStation();
      // 같은 묶음 안에서는 줄이 많은 카드부터 놓아, 2열 격자에서 높이가 같은 카드끼리 짝이 되게 한다.
      $('menus').innerHTML = groups.map((g) => `
        <section class="group" aria-label="${esc(g.name)}">
          ${groups.length > 1 ? `<h3>${esc(g.name)}</h3>` : ''}
          <div class="grid">${g.menus.slice().sort((a, b) => rowCount(b) - rowCount(a)).map(menuHtml).join('')}</div>
        </section>`).join('');
      renderCart();
    }

    /** 확인 창·합계에 쓰는 장바구니 줄 (메뉴 순서대로) */
    function cartLines() {
      const lines = [];
      // 선택지 정의 순서(HOT → ICE)로 정렬해 카드의 줄 순서와 맞춘다.
      const rank = (m, l) => l.options.map((name, i) => (m.options[i] ? m.options[i].choices.findIndex((c) => c.name === name) : 0));
      const cmp = (a, b) => { for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return a[i] - b[i]; return 0; };
      for (const m of state.menus) {
        const mine = Object.values(cart).filter((l) => l.menuId === m.id).sort((a, b) => cmp(rank(m, a), rank(m, b)));
        for (const l of mine) {
          const extra = l.options.reduce((s, name, i) => {
            const c = m.options[i] && m.options[i].choices.find((x) => x.name === name);
            return s + (c ? c.price : 0);
          }, 0);
          lines.push({ name: m.name, station: m.station, options: l.options, price: m.price + extra, qty: l.qty });
        }
      }
      return lines;
    }

    function renderCart() {
      const lines = cartLines();
      const count = lines.reduce((s, l) => s + l.qty, 0);
      const total = lines.reduce((s, l) => s + l.qty * l.price, 0);
      const perStation = groupsByStation()
        .map((g) => [g.name, lines.filter((l) => l.station === g.stationId).reduce((s, l) => s + l.qty, 0)])
        .filter(([, n]) => n > 0)
        .map(([name, n]) => `${name} ${n}`);
      if (!count) {
        $('cart-count').textContent = '메뉴를 담아 주세요';
        $('cart-big').textContent = '0개';
      } else if (total === 0) {
        $('cart-count').textContent = perStation.join(' · ');
        $('cart-big').textContent = `${count}개`;
      } else {
        $('cart-count').textContent = [`${count}개`, ...perStation].join(' · ');
        $('cart-big').textContent = won(total);
      }
      $('review').disabled = count === 0;
    }

    function linesHtml(items, withPrice) {
      return items.map((l) => `
        <tr>
          <td>${Kiosk.itemHtml(l)} <span class="x">× ${l.qty}</span></td>
          ${withPrice ? `<td>${priceText(l.qty * l.price)}</td>` : ''}
        </tr>`).join('');
    }

    function openConfirm() {
      const lines = cartLines();
      if (!lines.length) return;
      const total = lines.reduce((s, l) => s + l.qty * l.price, 0);
      $('confirm-table').textContent = `${table}번 테이블`;
      $('confirm-lines').innerHTML = linesHtml(lines, true) +
        `<tr class="total"><td>합계</td><td>${won(total)}</td></tr>`;
      const note = $('note').value.trim();
      $('confirm-note').innerHTML = note ? `${Kiosk.icon('sticky-note')} 요청사항: ${esc(note)}` : '';
      if (!pendingRequestId) pendingRequestId = Kiosk.requestId();
      $('confirm').hidden = false;
      $('confirm-send').focus();
    }

    async function sendOrder() {
      if (sending) return;
      sending = true;
      $('confirm-send').disabled = true;
      $('confirm-send').querySelector('span').textContent = '전송 중…';
      try {
        const order = await Kiosk.api('/api/orders', {
          tableNo: table,
          items: Object.values(cart).map(({ menuId, options, qty }) => ({ menuId, options, qty })),
          note: $('note').value,
          requestId: pendingRequestId,
        });
        $('confirm').hidden = true;
        $('done-title').textContent = `${order.tableNo}번 테이블 주문 완료`;
        $('done-lines').innerHTML = linesHtml(order.tickets.flatMap((t) => t.items), false);
        showDoneCountdown(`주문번호 ${order.id}${order.total ? ` · ${won(order.total)}` : ''}`);
        show('done');
        table = null;
        cart = {};
        picked = {};
        pendingRequestId = null;
        $('note').value = '';
      } catch (err) {
        // 네트워크 오류일 때는 같은 requestId 로 다시 보내므로 중복 주문이 생기지 않는다.
        Kiosk.toast(err.status ? err.message : '전송 실패 — 연결을 확인하고 다시 눌러 주세요.', true);
        if (err.status === 409 || err.status === 400) pendingRequestId = null;
      } finally {
        sending = false;
        $('confirm-send').disabled = false;
        $('confirm-send').querySelector('span').textContent = '주문 전송';
      }
    }

    $('tables').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-table]');
      if (!btn) return;
      const n = Number(btn.dataset.table);
      if (table != null && table !== n && Object.keys(cart).length) {
        Kiosk.toast(`담은 메뉴를 ${n}번 테이블로 옮겼습니다.`);
      }
      table = n;
      renderMenus();
      show('menu');
    });

    $('menus').addEventListener('click', (e) => {
      const opt = e.target.closest('button[data-opt-menu]');
      if (opt) {
        const m = state.menus.find((x) => x.id === opt.dataset.optMenu);
        const idx = (picked[m.id] || m.options.map(() => 0)).slice();
        idx[Number(opt.dataset.group)] = Number(opt.dataset.choice);
        picked[m.id] = idx;
        return renderMenus();
      }
      const btn = e.target.closest('button[data-key]');
      if (!btn) return;
      const v = variants[btn.dataset.key];
      if (!v) return;
      const key = btn.dataset.key;
      const qty = Math.max(0, Math.min(99, qtyOf(key) + Number(btn.dataset.delta)));
      if (qty) cart[key] = { menuId: v.menuId, options: v.options, qty };
      else delete cart[key];
      pendingRequestId = null;
      renderMenus();
    });

    $('change-table').addEventListener('click', () => {
      renderTables();
      show('table');
    });
    $('review').addEventListener('click', openConfirm);
    $('confirm-cancel').addEventListener('click', () => { $('confirm').hidden = true; });
    $('confirm-send').addEventListener('click', sendOrder);
    $('note').addEventListener('input', () => { pendingRequestId = null; });
    $('done-next').addEventListener('click', resetOrder);
    $('step-done').addEventListener('click', (e) => {
      if (doneTimer && !e.target.closest('#done-next')) stopCountdown('자동으로 돌아가지 않습니다. 확인이 끝나면 "새 주문"을 누르세요.');
    });

    Kiosk.setLeaveGuard(() =>
      Object.keys(cart).length ? '담고 있던 주문이 사라집니다.' : null);

    Kiosk.connect((s) => {
      state = s;
      document.title = `주문 입력 · ${s.title}`;
      // 품절된 메뉴가 장바구니에 있으면 뺀다.
      for (const m of s.menus) {
        if (!m.soldOut) continue;
        const keys = Object.keys(cart).filter((k) => cart[k].menuId === m.id);
        if (!keys.length) continue;
        for (const k of keys) delete cart[k];
        Kiosk.toast(`${m.name} 품절 — 장바구니에서 뺐습니다.`, true);
      }
      if (!$('step-table').hidden) renderTables();
      if (!$('step-menu').hidden) renderMenus();
    });
  </script>
</body>
</html>
