<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>관리자</title>
  <link rel="stylesheet" href="/common.css">
  <style>
    main { padding: 16px; max-width: 1100px; margin: 0 auto; }
    section { margin-bottom: 28px; }
    h2 { margin: 0 0 10px; font-size: var(--t-lg); font-weight: 800; }
    .card { padding: 16px; border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); }

    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
    .stat .label { color: var(--muted); font-size: var(--t-sm); font-weight: 700; }
    .stat .value { font-size: var(--t-xl); font-weight: 800; margin-top: 4px; font-variant-numeric: tabular-nums; }
    .stat .sub { color: var(--muted); font-size: var(--t-sm); margin-top: 2px; font-variant-numeric: tabular-nums; }
    .stat.tally { grid-column: span 2; }
    .tally-row { display: flex; gap: 20px; margin-top: 8px; flex-wrap: wrap; }
    .tally-row > div { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
    .tally-row .n { font-size: var(--t-xl); font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
    .tally-row .pending .n { color: var(--pending); }
    .tally-row .requested .n { color: var(--requested); }
    .tally-row .served .n { color: var(--served); }

    .menus { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
    .menu-row { display: flex; align-items: center; gap: 12px; }
    .menu-row.sold-out { background: var(--danger-bg); }
    .menu-row .info { flex: 1; }
    .menu-row .name { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: var(--t-lg); }
    .menu-row .muted { font-size: var(--t-sm); margin-top: 2px; }

    .links { display: flex; flex-wrap: wrap; gap: 10px; }
    .links a { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 10px 16px; border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); color: var(--text); text-decoration: none; font-weight: 700; font-size: var(--t-md); }

    .table-wrap { overflow-x: auto; border-radius: var(--radius); box-shadow: var(--shadow); }
    table.orders { width: 100%; border-collapse: collapse; background: var(--surface); font-size: var(--t-md); font-variant-numeric: tabular-nums; }
    table.orders th, table.orders td { padding: 12px 14px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
    table.orders th { background: #faf8f4; font-size: var(--t-sm); font-weight: 700; color: var(--muted); }
    table.orders td.items { white-space: normal; min-width: 180px; }
    table.orders tr.cancelled td { color: var(--muted); text-decoration: line-through; }
    table.orders tr.cancelled td:last-child, table.orders tr.cancelled td.status { text-decoration: none; }
    table.orders td.status .badge { margin: 2px 4px 2px 0; }
    table.orders .btn { min-height: 44px; padding: 8px 14px; font-size: var(--t-sm); }
    .filter { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
    .filter .btn { min-height: 44px; padding: 8px 16px; font-size: var(--t-sm); }
    .filter .btn.active { background: var(--text); color: #fff; }
    .filter .btn .n { margin-left: 6px; font-variant-numeric: tabular-nums; opacity: 0.8; }

    .danger-zone { border: 2px dashed var(--danger); }
    .danger-zone p { margin: 0 0 12px; font-size: var(--t-md); }

    .pin input { width: 100%; padding: 16px; font-size: var(--t-xl); border: 2px solid var(--line); border-radius: var(--radius); text-align: center; letter-spacing: 0.3em; }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="home-btn" href="/" aria-label="처음 화면으로"><i data-icon="house"></i><span class="label">처음 화면</span></a>
    <h1 id="title">관리자</h1>
    <span id="conn" class="conn">연결 중…</span>
  </header>

  <main>
    <section>
      <h2>오늘 현황</h2>
      <div class="stats" id="stats"></div>
    </section>

    <section>
      <h2>메뉴 품절 관리</h2>
      <div class="menus" id="menus"></div>
    </section>

    <section>
      <h2>주문 목록</h2>
      <div class="filter" id="filter">
        <button class="btn active" data-filter="active">진행 중<span class="n" id="n-active"></span></button>
        <button class="btn" data-filter="all">전체<span class="n" id="n-all"></span></button>
        <button class="btn" data-filter="cancelled">취소됨<span class="n" id="n-cancelled"></span></button>
      </div>
      <div class="table-wrap">
        <table class="orders">
          <thead>
            <tr><th>#</th><th>시각</th><th>테이블</th><th>메뉴</th><th>금액</th><th>진행 상태</th><th></th></tr>
          </thead>
          <tbody id="orders"></tbody>
        </table>
      </div>
    </section>

    <section>
      <h2>화면 바로가기</h2>
      <div class="links" id="links"></div>
    </section>

    <section>
      <div class="card danger-zone">
        <h2>전체 초기화</h2>
        <p class="muted">리허설 후 당일 시작 전에 사용하세요. 모든 주문과 품절 표시가 지워집니다. (기존 데이터는 data 폴더에 백업 파일로 남습니다)</p>
        <button class="btn btn-danger" id="reset"><i data-icon="trash-2"></i>전체 주문 초기화</button>
      </div>
    </section>
  </main>

  <div class="overlay" id="pin-dialog" hidden>
    <div class="dialog pin">
      <h2>관리자 PIN</h2>
      <input id="pin" type="password" inputmode="numeric" autocomplete="off">
      <div class="actions"><button class="btn btn-primary" id="pin-ok">확인</button></div>
    </div>
  </div>

  <script src="/icons.js"></script>
  <script src="/common.js"></script>
  <script>
    'use strict';
    const $ = (id) => document.getElementById(id);
    const { esc, won } = Kiosk;

    let state = null;
    let filter = 'active';
    let pin = '';
    try { pin = sessionStorage.getItem('kiosk-admin-pin') || ''; } catch { /* 저장 불가 */ }

    function adminApi(path, body) {
      return Kiosk.api(path, body, { 'X-Admin-Pin': pin }).catch((err) => {
        if (err.status === 401) askPin();
        throw err;
      });
    }

    function askPin() {
      $('pin-dialog').hidden = false;
      $('pin').value = '';
      $('pin').focus();
    }

    async function checkPin() {
      try {
        await Kiosk.api('/api/admin/check', {}, { 'X-Admin-Pin': pin });
        $('pin-dialog').hidden = true;
        return true;
      } catch (err) {
        if (err.status === 401) askPin();
        return false;
      }
    }

    function isDone(o) {
      return o.tickets.every((t) => t.status === 'served');
    }

    function renderStats() {
      const valid = state.orders.filter((o) => !o.cancelled);
      const revenue = valid.reduce((s, o) => s + o.total, 0);
      const perMenu = {};
      const perMenuWon = {};
      const perVariant = {};  // menuId -> { "ICE": 수량 }
      for (const o of valid) for (const t of o.tickets) for (const it of t.items) {
        perMenu[it.menuId] = (perMenu[it.menuId] || 0) + it.qty;
        perMenuWon[it.menuId] = (perMenuWon[it.menuId] || 0) + it.qty * it.price;
        if (it.options && it.options.length) {
          const v = (perVariant[it.menuId] ||= {});
          const key = it.options.join('/');
          v[key] = (v[key] || 0) + it.qty;
        }
      }
      const tickets = valid.flatMap((o) => o.tickets);
      const count = (st) => tickets.filter((t) => t.status === st).length;

      const boxes = [
        { label: '총 매출', value: won(revenue), sub: `주문 ${valid.length}건` },
        ...state.menus.map((m) => ({
          label: m.name,
          value: `${perMenu[m.id] || 0}개`,
          sub: [won(perMenuWon[m.id] || 0),
            Object.entries(perVariant[m.id] || {}).map(([k, n]) => `${k} ${n}`).join(', ')].filter(Boolean).join(' · '),
        })),
      ];
      const tally = ['pending', 'requested', 'served']
        .map((st) => `<div class="${st}"><span class="n">${count(st)}</span>${Kiosk.badge(st)}</div>`).join('');
      $('stats').innerHTML = boxes.map((b) => `
        <div class="card stat">
          <div class="label">${esc(b.label)}</div>
          <div class="value">${esc(b.value)}</div>
          <div class="sub">${esc(b.sub)}</div>
        </div>`).join('') + `
        <div class="card stat tally">
          <div class="label">주방별 주문표 진행 상태</div>
          <div class="tally-row">${tally}</div>
        </div>`;
    }

    function renderMenus() {
      $('menus').innerHTML = state.menus.map((m) => {
        const station = state.stations.find((s) => s.id === m.station);
        return `
          <div class="card menu-row ${m.soldOut ? 'sold-out' : ''}">
            <div class="info">
              <div class="name">${esc(m.name)}${m.soldOut ? '<span class="badge soldout">품절</span>' : '<span class="badge onsale">판매 중</span>'}</div>
              <div class="muted">${won(m.price)} · ${esc(station ? station.name : '')}</div>
              ${m.options.map((g) => `<div class="muted">${esc(g.name)}: ${g.choices.map((c) =>
                `${esc(c.name)}${c.price ? ` (${c.price > 0 ? '+' : ''}${won(c.price)})` : ''}`).join(' / ')}</div>`).join('')}
            </div>
            <button class="btn ${m.soldOut ? '' : 'btn-ghost'}" data-soldout="${esc(m.id)}" data-value="${m.soldOut ? 'false' : 'true'}">
              ${m.soldOut ? `${Kiosk.icon('rotate-ccw')}판매 재개` : `${Kiosk.icon('ban')}품절로 바꾸기`}
            </button>
          </div>`;
      }).join('');
    }

    function renderLinks() {
      $('links').innerHTML = [
        { href: '/order', icon: 'clipboard-list', label: '주문 입력' },
        ...state.stations.map((s) => ({ href: `/station/${s.id}`, icon: 'chef-hat', label: s.name })),
      ].map((l) => `<a href="${l.href}" target="_blank">${Kiosk.icon(l.icon)}${esc(l.label)}${Kiosk.icon('external-link', 'muted')}</a>`).join('');
    }

    function renderOrders() {
      $('n-active').textContent = state.orders.filter((o) => !o.cancelled && !isDone(o)).length;
      $('n-all').textContent = state.orders.length;
      $('n-cancelled').textContent = state.orders.filter((o) => o.cancelled).length;
      let list = state.orders.slice().reverse();
      if (filter === 'active') list = list.filter((o) => !o.cancelled && !isDone(o));
      if (filter === 'cancelled') list = list.filter((o) => o.cancelled);
      if (!list.length) {
        $('orders').innerHTML = '<tr><td colspan="7" class="muted" style="text-align:center;padding:24px">주문이 없습니다.</td></tr>';
        return;
      }
      $('orders').innerHTML = list.map((o) => {
        const items = o.tickets.flatMap((t) => t.items).map((it) => `${esc(Kiosk.itemLabel(it))} ${it.qty}`).join(', ');
        const statuses = o.cancelled
          ? '<span class="badge cancelled">취소됨</span>'
          : o.tickets.map((t) => {
              const s = state.stations.find((x) => x.id === t.stationId);
              return Kiosk.badge(t.status, `${s ? s.name : t.stationId}: ${Kiosk.STATUS_LABEL[t.status]}`);
            }).join(' ');
        return `
          <tr class="${o.cancelled ? 'cancelled' : ''}">
            <td>${o.id}</td>
            <td>${Kiosk.time(o.createdAt)}</td>
            <td><b>${o.tableNo}번</b></td>
            <td class="items">${items}${o.note ? `<div class="muted">${Kiosk.icon('sticky-note')} ${esc(o.note)}</div>` : ''}</td>
            <td>${won(o.total)}</td>
            <td class="status">${statuses}</td>
            <td>${o.cancelled
              ? `<button class="btn" data-cancel="${o.id}" data-value="false">${Kiosk.icon('rotate-ccw')}취소 철회</button>`
              : `<button class="btn btn-ghost" data-cancel="${o.id}" data-value="true">${Kiosk.icon('circle-x')}주문 취소</button>`}</td>
          </tr>`;
      }).join('');
    }

    function render() {
      if (!state) return;
      document.title = `관리자 · ${state.title}`;
      $('title').textContent = `${state.title} · 관리자`;
      renderStats();
      renderMenus();
      renderLinks();
      renderOrders();
    }

    $('menus').addEventListener('click', async (e) => {
      const btn = e.target.closest('button[data-soldout]');
      if (!btn) return;
      try {
        await adminApi(`/api/menus/${btn.dataset.soldout}/sold-out`, { soldOut: btn.dataset.value === 'true' });
      } catch (err) {
        Kiosk.toast(err.message, true);
      }
    });

    $('orders').addEventListener('click', async (e) => {
      const btn = e.target.closest('button[data-cancel]');
      if (!btn) return;
      const cancel = btn.dataset.value === 'true';
      if (cancel && !(await Kiosk.confirmDialog({
        title: `주문 #${btn.dataset.cancel}을 취소할까요?`,
        message: '주방 화면에서도 사라집니다. 취소한 뒤에도 “취소됨” 목록에서 되돌릴 수 있습니다.',
        confirmLabel: '주문 취소', cancelLabel: '닫기', danger: true,
      }))) return;
      try {
        await adminApi(`/api/orders/${btn.dataset.cancel}/cancel`, { cancelled: cancel });
        Kiosk.toast(cancel ? '주문을 취소했습니다.' : '주문 취소를 철회했습니다.');
      } catch (err) {
        Kiosk.toast(err.message, true);
      }
    });

    $('filter').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-filter]');
      if (!btn) return;
      filter = btn.dataset.filter;
      for (const b of $('filter').querySelectorAll('button')) b.classList.toggle('active', b === btn);
      renderOrders();
    });

    $('reset').addEventListener('click', async () => {
      const ok = await Kiosk.confirmDialog({
        title: '모든 주문을 초기화할까요?',
        message: '주문과 품절 표시가 모두 지워집니다. 계속하려면 아래에 “초기화”를 입력하세요.',
        confirmLabel: '초기화', cancelLabel: '닫기', danger: true, requireText: '초기화',
      });
      if (!ok) return;
      try {
        await adminApi('/api/reset');
        Kiosk.toast('초기화했습니다.');
      } catch (err) {
        Kiosk.toast(err.message, true);
      }
    });

    $('pin-ok').addEventListener('click', async () => {
      pin = $('pin').value;
      try { sessionStorage.setItem('kiosk-admin-pin', pin); } catch { /* 저장 불가 */ }
      if (!(await checkPin())) Kiosk.toast('PIN이 올바르지 않습니다.', true);
    });
    $('pin').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('pin-ok').click(); });

    checkPin();
    Kiosk.connect((s) => { state = s; render(); });
  </script>
</body>
</html>
