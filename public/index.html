<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>주문 시스템</title>
  <link rel="stylesheet" href="/common.css">
  <style>
    main { padding: 24px 16px; max-width: 560px; margin: 0 auto; }
    p { color: var(--muted); }
    .links { display: flex; flex-direction: column; gap: 14px; }
    .links a {
      display: block;
      padding: 24px;
      border-radius: 20px;
      background: var(--surface);
      box-shadow: var(--shadow);
      color: var(--text);
      text-decoration: none;
      font-size: 1.5rem;
      font-weight: 800;
    }
    .links a { display: flex; align-items: center; gap: 18px; }
    .links a .icon { width: 2.2rem; height: 2.2rem; color: var(--primary); }
    .links a small { display: block; margin-top: 4px; font-size: 1rem; font-weight: 500; color: var(--muted); }
  </style>
</head>
<body>
  <header class="topbar">
    <h1 id="title">주문 시스템</h1>
    <span id="conn" class="conn">연결 중…</span>
  </header>
  <main>
    <p>이 기기에서 사용할 화면을 고르세요.</p>
    <div class="links" id="links"></div>
  </main>
  <script src="/icons.js"></script>
  <script src="/common.js"></script>
  <script>
    'use strict';
    Kiosk.connect((s) => {
      document.title = s.title;
      document.getElementById('title').textContent = s.title;
      const station = (st) => {
        const menus = s.menus.filter((m) => m.station === st.id).map((m) => m.name).join(', ');
        return { href: `/station/${st.id}`, icon: 'chef-hat', label: st.name, desc: `${menus} 담당 서빙 직원용` };
      };
      const links = [
        { href: '/order', icon: 'clipboard-list', label: '주문 입력', desc: '주문받는 직원용 태블릿' },
        ...s.stations.map(station),
        { href: '/admin', icon: 'settings', label: '관리자', desc: '품절 처리, 주문 취소, 매출 현황' },
      ];
      document.getElementById('links').innerHTML = links
        .map((l) => `<a href="${l.href}">${Kiosk.icon(l.icon)}<span>${Kiosk.esc(l.label)}<small>${Kiosk.esc(l.desc)}</small></span></a>`)
        .join('');
    });
  </script>
</body>
</html>
